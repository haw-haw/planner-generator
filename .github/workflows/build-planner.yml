name: Build Planner PDFs

# Manually build the planner and publish the generated PDFs as a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release/tag name (e.g. v2027.1). Leave default to reuse the latest tag.'
        required: false
        default: 'v2027.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Google Chrome and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y wget fonts-noto-cjk
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version

      - name: Generate planner PDFs
        run: |
          # Prefer google-chrome-stable (apt package), fall back to chromium if present.
          for c in /usr/bin/google-chrome-stable /usr/bin/google-chrome /usr/bin/chromium; do
            if [ -x "$c" ]; then export CHROME="$c"; break; fi
          done
          echo "Using CHROME=$CHROME"
          python generate.py

      - name: Verify output
        run: |
          ls -lh output/*.pdf
          test -f output/planner-2027-A5.pdf
          test -f output/planner-2027-A6.pdf
          test -f output/planner-2027-A4-booklet.pdf
          test -f output/planner-2027-A5-booklet.pdf

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release/tag already exists: just refresh its assets.
            gh release upload "$TAG" output/*.pdf --clobber
          else
            gh release create "$TAG" output/*.pdf \
              --title "$TAG" \
              --notes "2027 printable planner PDFs (A5 / A6, saddle-stitch & folded)."
          fi
          gh release view "$TAG" --json name,assets --jq '{name, assets: [.assets[].name]}'

      - name: Upload planner PDFs (build artifact)
        uses: actions/upload-artifact@v7
        with:
          name: planner-2027-pdfs
          path: output/*.pdf
          if-no-files-found: error